name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches: 
      - main
jobs:
  build-and-test:
    name: '${{ matrix.platform }}: node.js ${{ matrix.node-version }}'
    timeout-minutes: 2
    strategy:
      matrix:
        platform:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        node-version:
          - 24
          - 26
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm test
